server:
  port: 8085

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      # latest: chỉ nhận đơn phát sinh từ lúc service chạy.
      # Để earliest thì lần đầu khởi động sẽ đọc lại toàn bộ đơn cũ và gửi mail hàng loạt.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Bỏ trống username/password -> service chạy ở chế độ thử, in mail ra log thay vì gửi thật.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    cache: false

notification:
  mail:
    from-name: ${MAIL_FROM_NAME:Ecommerce Shop}
