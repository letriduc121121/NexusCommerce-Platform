<!DOCTYPE html>
<!--/*
  Dùng chung cho mail "đặt hàng thành công" và "giao hàng thành công".

  Email khác web ở 2 điểm, đừng sửa thành cách viết thông thường:
  - CSS phải viết inline, vì Gmail xoá sạch <style> trong <head>
  - Bố cục bằng <table>, không dùng flexbox/grid (Outlook không hiểu)

  Chỗ nào có th:text thì phần chữ viết sẵn bên trong chỉ là nội dung xem trước
  khi mở file bằng trình duyệt - lúc gửi thật sẽ bị thay hết.

  Toàn bộ chú thích trong file dùng kiểu comment của Thymeleaf, sẽ bị xoá lúc
  render nên không lọt vào email gửi cho khách. Tuyệt đối không viết chuỗi
  đóng comment ở giữa phần chú thích, vì nó sẽ ngắt comment sớm.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Thông báo đơn hàng</title>
</head>
<body style="margin:0; padding:20px; background-color:#f4f4f4; font-family:Arial,sans-serif;">

<table cellpadding="0" cellspacing="0" border="0"
       style="width:100%; max-width:560px; margin:0 auto; background-color:#ffffff;">

    <!--/* Tiêu đề: màu nền đổi theo loại mail */-->
    <tr>
        <td th:style="'background-color:' + ${accentColor} + '; padding:24px;'"
            style="background-color:#111827; padding:24px;">
            <div style="color:#ffffff; font-size:20px; font-weight:bold;"
                 th:text="${heading}">Đặt hàng thành công!</div>
        </td>
    </tr>

    <!--/* Lời chào */-->
    <tr>
        <td style="padding:24px 24px 0 24px; font-size:14px; color:#333333; line-height:22px;">
            Xin chào <b th:text="${customerName}">Quý khách</b>,
            <div style="margin-top:8px;" th:text="${message}">Cảm ơn bạn đã đặt hàng.</div>
            <div style="margin-top:12px; color:#777777;">
                Mã đơn hàng: <b style="color:#333333;" th:text="'#' + ${orderId}">#A1B2C3D4</b>
            </div>
        </td>
    </tr>

    <!--/* Danh sách sản phẩm */-->
    <tr>
        <td style="padding:20px 24px;">
            <table cellpadding="0" cellspacing="0" border="0" style="width:100%;">

                <tr th:each="item : ${items}">
                    <td style="padding:10px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;">
                        <span th:text="${item.productName}">Tên sản phẩm</span>
                        <div style="margin-top:4px; font-size:12px; color:#999999;">
                            <span th:text="${item.price}">0 ₫</span> ×
                            <span th:text="${item.quantity}">1</span>
                        </div>
                    </td>
                    <td align="right"
                        style="padding:10px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;"
                        th:text="${item.subtotal}">0 ₫</td>
                </tr>

                <tr>
                    <td style="padding-top:14px; font-size:15px; font-weight:bold; color:#333333;">
                        Tổng cộng
                    </td>
                    <td align="right" style="padding-top:14px; font-size:17px; font-weight:bold;"
                        th:style="'padding-top:14px; font-size:17px; font-weight:bold; color:' + ${accentColor} + ';'"
                        th:text="${totalAmount}">0 ₫</td>
                </tr>

            </table>
        </td>
    </tr>

    <!--/* Thông tin giao hàng */-->
    <tr>
        <td style="padding:0 24px 24px 24px; font-size:14px; color:#333333; line-height:22px;">
            <div><span style="color:#777777;">Giao đến:</span>
                <span th:text="${shippingAddress}">123 Đường ABC</span></div>
            <div><span style="color:#777777;">Thanh toán:</span>
                <span th:text="${paymentMethod}">Khi nhận hàng (COD)</span></div>
        </td>
    </tr>

    <tr>
        <td style="padding:16px 24px; background-color:#fafafa; font-size:12px; color:#999999; text-align:center;">
            Email tự động, vui lòng không trả lời.
        </td>
    </tr>

</table>

</body>
</html>
