server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:8080
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**

        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/v1/orders/**

        - id: cart-service
          uri: http://${CART_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/v1/cart/**

        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/payments/**

        - id: inventory-service
          uri: http://${INVENTORY_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/v1/inventories/**

        - id: promotion-service
          uri: http://${PROMOTION_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/v1/vouchers/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://${FRONTEND_HOST:localhost}:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
