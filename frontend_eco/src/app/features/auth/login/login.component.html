<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Đăng Nhập Tài Khoản</h1>
      <p class="auth-subtitle">Nhập thông tin email và mật khẩu của bạn để tiếp tục</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        {{ errorMessage() }}
      </div>
    }

    <form (submit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Địa chỉ Email</label>
        <div class="input-wrapper">
          <lucide-angular [img]="MailIcon" [size]="18" class="input-icon"></lucide-angular>
          <input
            type="email"
            id="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="example@gmail.com"
            class="form-control"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password" class="form-label">Mật khẩu</label>
          <a routerLink="/login" class="forgot-password">Quên mật khẩu?</a>
        </div>
        <div class="input-wrapper">
          <lucide-angular [img]="LockIcon" [size]="18" class="input-icon"></lucide-angular>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            class="form-control"
            required
          />
          <button type="button" (click)="toggleShowPassword()" class="btn-toggle-eye">
            <lucide-angular [img]="showPassword() ? EyeOffIcon : EyeIcon" [size]="18"></lucide-angular>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-submit">
        <lucide-angular [img]="LogInIcon" [size]="18"></lucide-angular>
        Đăng Nhập
      </button>
    </form>

    <div class="auth-footer">
      <p>Chưa có tài khoản? <a routerLink="/register" class="link-switch">Đăng ký ngay <lucide-angular [img]="ArrowRightIcon" [size]="14"></lucide-angular></a></p>
    </div>
  </div>
</div>
